<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carroça Já</title>
<meta name="theme-color" content="#BC4316">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#241C17;
    --night-2:#3A2A20;
    --mustard:#BC4316;
    --mustard-soft:#F7DCC9;
    --sync-ok:#FFD79A;
    --sync-err:#FFB4A3;
    --brick:#C4453F;
    --bg:#F7F4EF;
    --card:#FFFFFF;
    --leaf:#1E8A56;
    --leaf-soft:#E4F5EB;
    --ink:#241C17;
    --line:#ECE4DA;
    --muted:#8C8175;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(21,22,28,0.04), 0 1px 1px rgba(21,22,28,0.03);
    --shadow-md:0 8px 24px rgba(21,22,28,0.07), 0 2px 6px rgba(21,22,28,0.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;}
  .icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:currentColor;flex-shrink:0;}

  header{
    background:var(--mustard);
    color:#fff;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:20;
    flex-shrink:0;
    box-shadow:0 4px 16px rgba(120,45,10,0.25);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:36px;height:36px;border-radius:11px;flex-shrink:0;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .brand-mark img{width:100%;height:100%;display:block;object-fit:cover;}
  .brand h1{font-weight:800;font-size:17px;margin:0;letter-spacing:-0.2px;}
  .brand span{display:block;font-size:10.5px;color:rgba(255,255,255,0.55);font-weight:600;letter-spacing:0.4px;text-transform:uppercase;margin-top:1px;}
  .back-btn{
    background:rgba(255,255,255,0.1);border:none;color:#fff;
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:background .15s;
  }
  .back-btn:active{background:rgba(255,255,255,0.18);}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--sync-ok);flex-shrink:0;box-shadow:0 0 0 3px rgba(255,215,154,0.3);}
  .sync-dot.off{background:rgba(255,255,255,0.5);box-shadow:0 0 0 3px rgba(255,255,255,0.15);}
  .sync-dot.err{background:var(--sync-err);box-shadow:0 0 0 3px rgba(255,180,163,0.3);}
  .sync-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:rgba(255,255,255,0.55);margin-top:3px;font-weight:600;}

  /* ---------- Tela 1: escolher bairro ---------- */
  #screenBairro{flex:1;overflow-y:auto;padding:22px 18px 30px;}
  .screen-title{font-weight:800;font-size:21px;margin:4px 0 6px;letter-spacing:-0.3px;}
  .screen-sub{font-size:13.5px;color:var(--muted);margin:0 0 18px;line-height:1.5;}
  .search-wrap{position:relative;margin-bottom:18px;}
  .search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;}
  .search-box{
    background:var(--card);border:1.5px solid var(--line);border-radius:999px;
    padding:12px 14px 12px 40px;font-size:14px;width:100%;
    font-family:'Manrope',sans-serif;color:var(--ink);
  }
  .search-box:focus{outline:none;border-color:var(--mustard);}
  .bairro-list{display:flex;flex-direction:column;gap:9px;}
  .bairro-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:15px 16px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;transition:transform .12s, box-shadow .12s;box-shadow:var(--shadow-sm);
  }
  .bairro-card:active{transform:scale(0.98);box-shadow:none;}
  .bairro-name{font-weight:700;font-size:15px;}
  .bairro-count{font-size:12px;color:var(--leaf);font-weight:600;margin-top:3px;}
  .bairro-arrow{color:var(--mustard);font-size:18px;background:var(--mustard-soft);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .loading-msg{padding:40px 10px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---------- Tela 2: lista de carroceiros do bairro ---------- */
  #screenLista{flex:1;overflow-y:auto;display:none;flex-direction:column;}
  .lista-header{padding:20px 18px 12px;}
  .lista-header h2{font-size:19px;font-weight:800;margin:0 0 3px;letter-spacing:-0.2px;}
  .lista-header p{font-size:12.5px;color:var(--muted);margin:0;font-weight:500;}
  .carroceiro-list{padding:6px 18px 24px;display:flex;flex-direction:column;gap:10px;}
  .cc-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .12s;
  }
  .cc-card:active{transform:scale(0.98);}
  .avatar{
    width:46px;height:46px;border-radius:50%;background:var(--night);color:var(--mustard);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;flex-shrink:0;
  }
  .cc-info{flex:1;min-width:0;}
  .cc-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px;}
  .cc-service{font-size:11.5px;color:var(--leaf);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}
  .cc-stars{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:5px;}
  .cc-stars .stars-row{display:inline-flex;gap:1px;color:var(--mustard);font-size:13px;}
  .cc-stars b{color:var(--ink);font-weight:700;}
  .status-tag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;flex-shrink:0;}
  .status-tag.on{background:var(--leaf-soft);color:var(--leaf);}
  .status-tag.off{background:var(--bg);color:var(--muted);}
  .empty-lista{padding:40px 24px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;}

  /* ---------- Tela 3: perfil ---------- */
  #screenPerfil{flex:1;overflow-y:auto;display:none;}
  .perfil-hero{padding:24px 20px 20px;background:var(--card);border-bottom:1px solid var(--line);}
  .perfil-top{display:flex;gap:14px;align-items:flex-start;}
  .avatar-lg{
    width:58px;height:58px;border-radius:50%;background:var(--night);color:var(--mustard);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;flex-shrink:0;
  }
  .perfil-name{font-weight:800;font-size:19px;margin:0;letter-spacing:-0.2px;}
  .perfil-service{font-size:12px;color:var(--leaf);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;margin-top:4px;}
  .perfil-stars{margin-top:9px;font-size:14px;display:flex;align-items:center;gap:6px;}
  .perfil-stars .stars-row{display:inline-flex;gap:1px;color:var(--mustard);}
  .perfil-stars b{color:var(--ink);font-size:14px;font-weight:700;}
  .perfil-stars small{color:var(--muted);font-weight:500;}
  .status-row{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600;}
  .status-row .dot{width:7px;height:7px;border-radius:50%;background:var(--leaf);}
  .status-row.off .dot{background:#B3B8C4;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 20px 0;}
  .info-box{background:var(--bg);border-radius:var(--radius-sm);padding:11px 13px;}
  .info-box .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;}
  .info-box .value{font-size:13.5px;font-weight:700;color:var(--ink);margin-top:3px;}

  .actions{display:flex;gap:10px;padding:18px 20px 4px;}
  .btn{
    flex:1;padding:14px 10px;border-radius:999px;border:none;font-family:'Manrope',sans-serif;
    font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:7px;text-decoration:none;transition:transform .12s,opacity .12s;
  }
  .btn:active{transform:scale(0.97);}
  .btn .icon{font-size:16px;}
  .btn-wpp{background:var(--leaf);color:#fff;}
  .btn-call{background:var(--night);color:#fff;}

  .section{padding:20px 20px;}
  .section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);font-weight:700;margin:0 0 12px;}

  .review{font-size:13.5px;color:#43454F;line-height:1.5;padding:12px 0;border-top:1px solid var(--line);}
  .review:first-child{border-top:none;padding-top:0;}
  .review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
  .review-top b{color:var(--ink);font-size:13.5px;}
  .review-stars{display:inline-flex;gap:1px;color:var(--mustard);font-size:12px;}
  .review-pending{font-size:10.5px;color:var(--brick);font-weight:700;margin-left:6px;}

  .rate-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:18px;margin-top:4px;box-shadow:var(--shadow-sm);}
  .rate-box h4{margin:0 0 12px;font-size:13.5px;font-weight:700;}
  .star-picker{display:flex;gap:8px;font-size:28px;color:#DADCE3;cursor:pointer;margin-bottom:14px;}
  .star-picker span{transition:transform .1s;}
  .star-picker span:active{transform:scale(1.15);}
  .star-picker span.active{color:var(--mustard);}
  .comment-input{
    width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;
    font-family:'Manrope',sans-serif;font-size:13.5px;resize:none;min-height:64px;margin-bottom:12px;color:var(--ink);
  }
  .comment-input:focus{outline:none;border-color:var(--mustard);}
  .btn-send{background:var(--night);color:#fff;width:100%;padding:13px;border-radius:999px;
    border:none;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,opacity .12s;}
  .btn-send:active:not(:disabled){transform:scale(0.98);}
  .btn-send:disabled{opacity:0.35;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" id="brandBlock">
      <div class="brand-mark"><img src="logo.png" alt="Carroça Já"></div>
      <div>
        <h1>Carroça Já</h1>
        <span>Vitória da Conquista</span>
        <div class="sync-row"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">sincronizando…</span></div>
      </div>
    </div>
    <button class="back-btn" id="backBtn" style="display:none;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5-1.4 1.4L5.2 12 14.1 3.1z"/></svg>
      Voltar
    </button>
  </header>

  <!-- TELA 1: escolher bairro -->
  <div id="screenBairro">
    <div class="screen-title">Onde você precisa do carroceiro?</div>
    <p class="screen-sub">Escolha o bairro. Mostramos só quem atua na região — carroceiro informa a própria área de atuação.</p>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.38 1.42-1.41-5.39-5.39A8 8 0 0 0 10 2m0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12"/></svg>
      <input class="search-box" id="searchBairro" placeholder="Buscar bairro...">
    </div>
    <div class="bairro-list" id="bairroList"></div>
  </div>

  <!-- TELA 2: lista de carroceiros -->
  <div id="screenLista">
    <div class="lista-header">
      <h2 id="listaTitulo">Bairro</h2>
      <p id="listaSub">carroceiros disponíveis</p>
    </div>
    <div class="carroceiro-list" id="carroceiroList"></div>
  </div>

  <!-- TELA 3: perfil -->
  <div id="screenPerfil"></div>
</div>

<script>
// ---------- Configuração ----------
const CONFIG = {
  // Cole aqui a URL do Google Apps Script publicado (termina em /exec).
  // Enquanto ficar vazio, o app roda só com os dados de exemplo abaixo (SEED) + cache local.
  SHEETS_URL: 'https://script.google.com/macros/s/AKfycbwzmeDEuOFSoAPE5HPETDIpucO3ArKgIds1MsN7QwhkW5mZS12QZPl840G9S-aodm4u/exec',
  // Mesmo valor do TOKEN definido em apps-script/Code.gs, se você configurou um.
  TOKEN: ''
};

const bairros = ["Nova Cidade", "Candeias", "Recreio", "Jurema", "Guarani", "Centro", "Ibirapuera", "Patagônia"];

// Dados de exemplo — usados só até a planilha estar configurada, ou como fallback offline.
const SEED_CARROCEIROS = [
  { id:1, nome:"Zé Raimundo", servico:"Coleta de entulho e mudanças pequenas",
    areas:["Nova Cidade","Candeias"], telefone:"5577988013134",
    online:true, tempo:"8 anos de atuação",
    reviews:[
      {autor:"Marta S.", nota:5, texto:"Rápido e cuidadoso com os móveis. Recomendo."},
      {autor:"Antônio F.", nota:4, texto:"Preço justo, chegou no horário combinado."}
    ]},
  { id:2, nome:"Val Carroceiro", servico:"Transporte de materiais de construção",
    areas:["Recreio","Jurema"], telefone:"5577992345602",
    online:true, tempo:"5 anos de atuação",
    reviews:[
      {autor:"Ivone P.", nota:5, texto:"Trouxe a areia rapidinho, muito educado."}
    ]},
  { id:3, nome:"Cabo Verde", servico:"Retirada de galhos e poda",
    areas:["Guarani","Ibirapuera"], telefone:"5577993456703",
    online:false, tempo:"2 anos de atuação",
    reviews:[
      {autor:"Josenildo A.", nota:4, texto:"Bom trabalho, só demorou um pouco pra responder."}
    ]},
  { id:4, nome:"Seu Damião", servico:"Mudanças e fretes gerais",
    areas:["Centro","Nova Cidade"], telefone:"5577994567804",
    online:true, tempo:"12 anos de atuação",
    reviews:[
      {autor:"Rita M.", nota:5, texto:"O carroceiro mais confiável da região, uso sempre."},
      {autor:"Paulo H.", nota:5, texto:"Cuidou de tudo com muito respeito."}
    ]}
];

let carroceiros = [];
let currentBairro = null;
let currentCarroceiro = null;
let pendingStars = 0;

// ---------- Persistência local (cache offline) ----------
function salvarLocal(){ localStorage.setItem('cj_carroceiros', JSON.stringify(carroceiros)); }
function carregarLocal(){ const raw = localStorage.getItem('cj_carroceiros'); return raw ? JSON.parse(raw) : null; }
function salvarFila(fila){ localStorage.setItem('cj_fila_avaliacoes', JSON.stringify(fila)); }
function carregarFila(){ const raw = localStorage.getItem('cj_fila_avaliacoes'); return raw ? JSON.parse(raw) : []; }

// ---------- JSONP (evita problemas de CORS com Apps Script) ----------
function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const callbackName = 'cj_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    const qs = new URLSearchParams(Object.assign({}, params, { callback: callbackName }));
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('tempo esgotado'));
    }, 10000);
    function cleanup(){
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }
    window[callbackName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('falha na conexão')); };
    script.src = url + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

// ---------- Status de sincronização ----------
function setSyncStatus(status){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot' + (status === 'off' ? ' off' : status === 'err' ? ' err' : '');
  label.textContent = {
    ok: 'sincronizado',
    off: 'modo local (sem planilha configurada)',
    syncing: 'sincronizando…',
    err: 'sem conexão — usando dados salvos',
    sending: 'enviando avaliação…'
  }[status] || status;
}

// ---------- Carregamento de dados ----------
async function carregarCarroceiros(){
  if(!CONFIG.SHEETS_URL){
    carroceiros = carregarLocal() || SEED_CARROCEIROS;
    setSyncStatus('off');
    return;
  }
  setSyncStatus('syncing');
  try{
    const data = await jsonp(CONFIG.SHEETS_URL, { action:'list', token: CONFIG.TOKEN });
    if(!data.success) throw new Error(data.error || 'erro desconhecido');
    carroceiros = data.carroceiros;
    salvarLocal();
    setSyncStatus('ok');
  } catch(err){
    console.warn('Sync falhou, usando dados locais:', err);
    carroceiros = carregarLocal() || SEED_CARROCEIROS;
    setSyncStatus('err');
  }
}

async function enviarAvaliacao(carroceiroId, autor, nota, texto){
  if(!CONFIG.SHEETS_URL) return { success:false, offline:true };
  try{
    setSyncStatus('sending');
    const data = await jsonp(CONFIG.SHEETS_URL, { action:'avaliar', token: CONFIG.TOKEN, carroceiroId, autor, nota, texto });
    setSyncStatus(data.success ? 'ok' : 'err');
    return data;
  } catch(err){
    const fila = carregarFila();
    fila.push({ carroceiroId, autor, nota, texto });
    salvarFila(fila);
    setSyncStatus('err');
    return { success:false, offline:true };
  }
}

async function flushFila(){
  if(!CONFIG.SHEETS_URL) return;
  const fila = carregarFila();
  if(!fila.length) return;
  const restantes = [];
  for(const item of fila){
    try{
      const data = await jsonp(CONFIG.SHEETS_URL, Object.assign({ action:'avaliar', token: CONFIG.TOKEN }, item));
      if(!data.success) restantes.push(item);
    } catch(err){
      restantes.push(item);
    }
  }
  salvarFila(restantes);
  if(restantes.length < fila.length) await carregarCarroceiros();
}
window.addEventListener('online', flushFila);

// ---------- Utilitários ----------
function avg(c){ if(!c.reviews.length) return 0; return c.reviews.reduce((s,r)=>s+r.nota,0) / c.reviews.length; }
const STAR_PATH = 'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.8 3.2 1.1-6.6L2.5 9.4l6.6-.9z';
function starIcon(filled){
  return `<svg class="icon" viewBox="0 0 24 24" style="fill:${filled ? 'var(--mustard)' : 'var(--line)'}"><path d="${STAR_PATH}"/></svg>`;
}
function starsStr(rating){
  const full = Math.round(rating);
  let s = '<span class="stars-row">';
  for(let i=0;i<5;i++) s += starIcon(i < full);
  return s + '</span>';
}
function initials(nome){ return nome.split(' ').map(w=>w[0]).slice(0,2).join(''); }

// ---------- Navegação ----------
function showScreen(name){
  document.getElementById('screenBairro').style.display = name==='bairro' ? 'block' : 'none';
  document.getElementById('screenLista').style.display = name==='lista' ? 'flex' : 'none';
  document.getElementById('screenPerfil').style.display = name==='perfil' ? 'block' : 'none';
  document.getElementById('backBtn').style.display = name==='bairro' ? 'none' : 'flex';
}
document.getElementById('backBtn').addEventListener('click', () => {
  if(document.getElementById('screenPerfil').style.display === 'block'){
    renderLista(currentBairro);
    showScreen('lista');
  } else {
    showScreen('bairro');
  }
});

// ---------- Tela 1 ----------
function renderBairros(filter=''){
  const list = document.getElementById('bairroList');
  const f = filter.toLowerCase();
  list.innerHTML = bairros
    .filter(b => b.toLowerCase().includes(f))
    .map(b => {
      const count = carroceiros.filter(c => c.areas.includes(b)).length;
      return `<div class="bairro-card" onclick="selectBairro('${b}')">
        <div>
          <div class="bairro-name">${b}</div>
          <div class="bairro-count">${count} carroceiro${count===1?'':'s'} cadastrado${count===1?'':'s'}</div>
        </div>
        <div class="bairro-arrow"><svg class="icon" viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5-1.4-1.4L13.1 12 6.1 5.9z"/></svg></div>
      </div>`;
    }).join('');
}
document.getElementById('searchBairro').addEventListener('input', e => renderBairros(e.target.value));

function selectBairro(b){
  currentBairro = b;
  renderLista(b);
  showScreen('lista');
}

// ---------- Tela 2 ----------
function renderLista(b){
  document.getElementById('listaTitulo').textContent = b;
  const items = carroceiros.filter(c => c.areas.includes(b));
  document.getElementById('listaSub').textContent = items.length + ' carroceiro' + (items.length===1?'':'s') + ' atuando nesse bairro';
  const wrap = document.getElementById('carroceiroList');
  if(!items.length){
    wrap.innerHTML = '<div class="empty-lista">Ainda não tem carroceiro cadastrado nesse bairro.</div>';
    return;
  }
  wrap.innerHTML = items.map(c => {
    const r = avg(c);
    return `<div class="cc-card" onclick="openPerfil(${c.id})">
      <div class="avatar">${initials(c.nome)}</div>
      <div class="cc-info">
        <div class="cc-name">${c.nome}</div>
        <div class="cc-service">${c.servico}</div>
        <div class="cc-stars">${starsStr(r)} <b>${r.toFixed(1)}</b> <span>(${c.reviews.length})</span></div>
      </div>
      <div class="status-tag ${c.online?'on':'off'}">${c.online?'Disponível':'Offline'}</div>
    </div>`;
  }).join('');
}

// ---------- Tela 3 ----------
function openPerfil(id){
  currentCarroceiro = carroceiros.find(c => String(c.id) === String(id));
  pendingStars = 0;
  renderPerfil();
  showScreen('perfil');
}

function renderPerfil(){
  const c = currentCarroceiro;
  const r = avg(c);
  const waLink = `https://wa.me/${c.telefone}?text=${encodeURIComponent('Olá ' + c.nome + '! Encontrei seus serviços por meio do app Carroça Já e preciso de um serviço. Depois que o serviço for concluído, vou voltar no app pra avaliar seu atendimento.')}`;
  document.getElementById('screenPerfil').innerHTML = `
    <div class="perfil-hero">
      <div class="perfil-top">
        <div class="avatar-lg">${initials(c.nome)}</div>
        <div>
          <p class="perfil-name">${c.nome}</p>
          <div class="perfil-service">${c.servico}</div>
          <div class="perfil-stars">${starsStr(r)} <b>${r.toFixed(1)}</b> <small>(${c.reviews.length} avaliações)</small></div>
        </div>
      </div>
      <div class="status-row ${c.online?'':'off'}"><span class="dot"></span> ${c.online?'Disponível agora':'Offline no momento'}</div>
    </div>

    <div class="info-grid">
      <div class="info-box"><div class="label">Área de atuação</div><div class="value">${c.areas.join(', ')}</div></div>
      <div class="info-box"><div class="label">Experiência</div><div class="value">${c.tempo}</div></div>
    </div>

    <div class="actions">
      <a class="btn btn-wpp" href="${waLink}" target="_blank">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2m0 2a8 8 0 0 1 6.9 12.1l-.3.5.5 2.9-2.9-.8-.5.3A8 8 0 1 1 12 4m-3.4 4.1c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.1 2 3.1 4.8 4.3 2.4 1 2.9.8 3.4.8.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.3-.6-.4l-2.1-1c-.3-.1-.5-.2-.7.2s-.9 1-1 1.2c-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.3-.2-.3 0-.5.1-.7l.5-.6c.1-.2.2-.3.3-.5s0-.4 0-.5c0-.2-.7-1.8-1-2.4-.2-.6-.5-.5-.7-.5z"/></svg>
        WhatsApp
      </a>
      <a class="btn btn-call" href="tel:${c.telefone}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.7 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.1 21 3 13.9 3 5c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/></svg>
        Ligar
      </a>
    </div>

    <div class="section">
      <div class="section-title">Avaliações</div>
      ${c.reviews.map(rv => `
        <div class="review">
          <div class="review-top"><b>${rv.autor}</b><span class="review-stars">${starsStr(rv.nota)}</span>${rv.pendente ? '<span class="review-pending">enviando…</span>' : ''}</div>
          ${rv.texto}
        </div>`).join('')}
    </div>

    <div class="section" style="padding-top:0;">
      <div class="rate-box">
        <h4>Deixe sua avaliação</h4>
        <div class="star-picker" id="starPicker">
          ${[1,2,3,4,5].map(n => `<span data-n="${n}" onclick="pickStar(${n})"><svg class="icon" viewBox="0 0 24 24" style="fill:currentColor"><path d="${STAR_PATH}"/></svg></span>`).join('')}
        </div>
        <textarea class="comment-input" id="commentInput" placeholder="Como foi o serviço?"></textarea>
        <button class="btn-send" id="sendBtn" onclick="submitReview()" disabled>Enviar avaliação</button>
      </div>
    </div>
  `;
}

function pickStar(n){
  pendingStars = n;
  document.querySelectorAll('#starPicker span').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.n) <= n);
  });
  document.getElementById('sendBtn').disabled = false;
}

async function submitReview(){
  const texto = document.getElementById('commentInput').value.trim();
  if(pendingStars === 0) return;
  const nota = pendingStars;
  const novaReview = { autor: 'Você', nota, texto: texto || '(sem comentário)', pendente: true };
  currentCarroceiro.reviews.unshift(novaReview);
  pendingStars = 0;
  renderPerfil();
  salvarLocal();

  const resultado = await enviarAvaliacao(currentCarroceiro.id, 'Você', nota, texto);
  novaReview.pendente = !(resultado && resultado.success);
  renderPerfil();
  salvarLocal();
}

// ---------- Inicialização ----------
async function iniciar(){
  document.getElementById('bairroList').innerHTML = '<div class="loading-msg">Carregando carroceiros…</div>';
  await carregarCarroceiros();
  renderBairros();
  showScreen('bairro');
  flushFila();
}
iniciar();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW falhou:', err));
  });
}
</script>
</body>
</html>
